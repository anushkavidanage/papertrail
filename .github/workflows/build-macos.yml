name: Build Installers (macOS)

# Builds the macOS installers: the ad-hoc signed DMG and ZIP that are
# distributed today, plus the certificate-signed variants (Developer ID
# notarized DMG, App Store PKG, development DMG) and an unsigned-flavour
# build. Moved unchanged from installers.yaml; see the per-job comments.
#
# Two ways to trigger it, which coexist:
#
# 1. A push to dev, build or installers whose commit message has one of the
#    keywords listed per job below. Artefact names are unchanged from the
#    original installers.yaml and the workflow name still starts with "Build
#    Installers", so `make ginstall` (installers/update.sh) keeps uploading
#    them to solidcommunity.au.
#
# 2. A version tag (v*) whose commit or tag message contains "publish" or a
#    job's own keyword. Public builds are then also attached to that tag's
#    GitHub Release. "bump version" is ignored on tags, so tagging the bump
#    commit does not rebuild what the branch push already built.
#
# Or run it by hand from the Actions tab: the public builds, plus the signed
# variants when the "signed" input is ticked.
#
# Keywords: "bump version", "build installers", "build macos original" for
# the ad-hoc build; "bump version x", "build installers x" for all variants,
# or "build macos release|unsigned|appstore|dev" for one. On a tag, only the
# ad-hoc DMG/ZIP (README downloads) and the notarized DMG are attached to the
# release; the App Store PKG and development builds stay artefacts.
#
# 20260715 The unsigned, appstore and dev jobs need macos/project.yml (for
# xcodegen) and the unsigned/staging/dev flavour schemes, which this
# repository does not have yet, so they fail until those are added.

on:
  workflow_dispatch:
    inputs:
      signed:
        description: Also build the certificate-signed variants (needs the Apple secrets)
        type: boolean
        default: false
  push:
    branches: [dev, build, installers]
    tags: ['v*']

permissions:
  contents: write # required to create and add to a release on a tag

env:
  APP: papertrail
  MACOS_APP_RELEASE_UNSIGNED_PATH: build/macos/Build/Products/Release-unsigned
  MACOS_APP_RELEASE_STAGING_PATH: build/macos/Build/Products/Release-staging
  MACOS_APP_RELEASE_DEV_PATH: build/macos/Build/Products/Release-dev
  # Keep in step with FLUTTER_VERSION in ci.yaml and the other build-*.
  FLUTTER_VERSION: "3.47.0"

jobs:

  # Decides which jobs run. The job-level if keeps it from even starting a
  # runner on an ordinary push. On a tag the message comes from git and the
  # REST API rather than head_commit, which is empty when an already-pushed
  # commit is tagged later. Matching is case-insensitive, as GitHub's
  # contains() was in the original installers.yaml.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch'
      || startsWith(github.ref, 'refs/tags/v')
      || contains(github.event.head_commit.message, 'bump version')
      || contains(github.event.head_commit.message, 'build ')
    runs-on: ubuntu-latest
    outputs:
      original: ${{ steps.check.outputs.original }}
      notarized: ${{ steps.check.outputs.notarized }}
      unsigned: ${{ steps.check.outputs.unsigned }}
      appstore: ${{ steps.check.outputs.appstore }}
      dev: ${{ steps.check.outputs.dev }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ inputs.signed }}
        run: |
          msg=$(git log -1 --format=%B)
          is_tag=false
          if [ "${{ github.ref_type }}" = "tag" ]; then
            is_tag=true
            # The shallow checkout flattens an annotated tag; the REST API
            # still has its message.
            tag_sha=$(gh api "repos/${{ github.repository }}/git/refs/tags/${{ github.ref_name }}" --jq 'select(.object.type == "tag") | .object.sha')
            if [ -n "$tag_sha" ]; then
              msg="$msg"$'\n'$(gh api "repos/${{ github.repository }}/git/tags/$tag_sha" --jq '.message')
            fi
          fi
          echo "Message: $msg"
          kw() { grep -qiF -- "$1" <<<"$msg"; }
          # "bump version" counts on branch pushes only, so tagging the bump
          # commit does not rebuild; "publish" counts on tags only.
          bump() { [ "$is_tag" = false ] && kw "$1"; }
          pub() { [ "$is_tag" = true ] && kw "publish"; }
          manual() { [ "${{ github.event_name }}" = "workflow_dispatch" ]; }
          signed() { manual && [ "$SIGNED" = "true" ]; }
          out() { if "$@"; then echo true; else echo false; fi; }
          {
            echo "original=$(out eval 'manual || pub || bump "bump version" || kw "build installers" || kw "build macos original"')"
            echo "notarized=$(out eval 'signed || bump "bump version x" || kw "build installers x" || kw "build macos release"')"
            echo "unsigned=$(out eval 'signed || bump "bump version x" || kw "build installers x" || kw "build macos unsigned"')"
            echo "appstore=$(out eval 'signed || bump "bump version x" || kw "build installers x" || kw "build macos appstore"')"
            echo "dev=$(out eval 'signed || bump "bump version x" || kw "build installers x" || kw "build macos dev"')"
          } | tee -a "$GITHUB_OUTPUT"

  # MACOS - ORIGINAL - DEPRECATED EVENTUALLY
  #
  # 20251223 gjw This is the original script for building the macOS
  # dmg and zip files for Rattle. While the macOS and iOS installer
  # builds are being set up and tested, they do not get build with a
  # 'bump version' but do get build with 'bump version x' (all get
  # built) or 'build installers' (all get built) or a specific 'build
  # mac os unsigned' etc included in the commit message.
  #
  # 20260101 gjw This original one no longer works for the updated
  # version by @jesscmoore which utilises flavours. But that then
  # needs extra setup that I've not yet done for my template in geopod
  # and bookoflife, which needs to be done. Once that is done and the
  # steps have a template, this ORIGINAL build can be removed.

  package-macos-dmg-zip-original:
    needs: gate
    if: needs.gate.outputs.original == 'true'

    # 20260809 gjw Was pinned to macos-14 because later images reported
    # "Xcode failed to resolve Swift Package Manager dependencies". The real
    # cause is the opposite of too-new: macos-14 carries Xcode 15.4 (Swift
    # 5.10), and flutter_gemma's Package.swift uses a trailing comma in an
    # argument list, which is Swift 6.1 syntax (SE-0439, Xcode 16.3). Since
    # the Podfile is removed below the build is pure SPM, so every plugin
    # manifest must compile. Hence a current image, with the newest Xcode
    # selected explicitly rather than relying on the image default.

    runs-on: macos-latest

    steps:
      - name: Display OS Information
        run: |
          system_profiler SPSoftwareDataType

      - name: Select the newest Xcode
        # flutter_gemma's manifest needs Swift 6.1 (Xcode 16.3 or later).
        # Chosen by sort order so this does not break when the image's Xcode
        # versions change; the versions are logged to make any future
        # toolchain failure diagnosable from the run alone.
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swift --version

      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Confirm Flutter Version
        run: flutter --version

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter create --platforms=macos --org=com.togaware .

      - name: Remove Podfile and project.yaml
        # 20260102 gjw These cause the default basic build to fail as
        # for some reason an older macOS version is targeted.
        run: |
          rm -f macos/Podfile macos/project.yml

      # 20260712 gjw keychain-access-groups is a restricted
      # entitlement that requires a provisioning profile. With ad-hoc
      # signing AMFI kills the app at launch (SIGKILL Code Signature
      # Invalid) even though codesign --verify passes. On the mac you
      # can strip the entitlements with `codesign --force --deep -s -
      # /Applications/mypod.app`. We strip it here for the
      # no-certificate build. Consequence: flutter_secure_storage, as
      # utilised by solidpod utilises, cannot persist to the keychain,
      # so the security key is not cached between sessions, resulting
      # in a "press twice" beahviour rather than remembering it,
      # inherent to no-certificate distribution. The Developer ID
      # signed build keeps the entitlement and hence no "press twice"
      # problem.

      - name: Strip restricted entitlements (invalid with ad-hoc signing)
        run: |
          for f in macos/Runner/Release.entitlements macos/Runner/DebugProfile.entitlements; do
            if /usr/libexec/PlistBuddy -c "Print :keychain-access-groups" "$f" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" "$f"
              echo "Removed keychain-access-groups from $f"
            fi
          done

      - name: Build Flutter macOS app
        run: flutter build macos --release

      - name: Note the build location
        run: |
          pwd
          ls -lh build/macos/Build/Products/Release

      # 20260712 gjw Verify the ad-hoc signature Xcode applied during
      # the build. If this fails here it would be SIGKILLed (Code
      # Signature Invalid) on the user's Mac, so fail the build
      # instead.

      - name: Verify macOS app code signature
        run: |
          codesign --verify --deep --strict --verbose=2 \
            "build/macos/Build/Products/Release/${{env.APP}}.app"

      # Package as DMG

      - name: Create DMG Unsigned
        run: |
          mkdir -p dmg_temp
          cp -R "build/macos/Build/Products/Release/${{env.APP}}.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "${{env.APP}}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "${{env.APP}}-macos.dmg"

      - name: Note the DMG created
        run: |
          ls -lh

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.APP}}-macos-dmg
          path: ${{env.APP}}-macos.dmg

      # Package as ZIP
      #
      # 20260712 gjw Use ditto rather than zip (thedoctor0/zip-release)
      # here. A .app relies on the symlinks inside its embedded
      # frameworks (FlutterMacOS.framework etc) and plain zip does not
      # preserve them, which breaks the code signature seal and the
      # app is then SIGKILLed (Code Signature Invalid) on launch.
      # ditto preserves symlinks, resource forks and permissions.

      - name: Create ZIP
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "build/macos/Build/Products/Release/${{env.APP}}.app" \
            "${{env.APP}}-macos.zip"

      - name: Review ZIP exists
        run: ls -lh ${{env.APP}}-macos.zip

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{env.APP}}-macos-zip
          path: ${{env.APP}}-macos.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Published, not a draft, so every build workflow adds to the same
          # release; a second create fails because the first won, hence the
          # final view.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes --title "Papertrail ${TAG#v}" \
            || gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "${APP}-macos.dmg" "${APP}-macos.zip" --clobber

  ########################################################################
  # MACOS - Graham's attempt to use certificate and appstore
  #
  # From Claude 20260712
  #
  # 1. Create a Developer ID Application certificate: Apple Developer
  # portal → Certificates → create a new "Developer ID Application"
  # (requires Account Holder privileges, and each account is limited
  # to a small number). Export it as a .p12 including the private key,
  # then base64-encode it.
  #
  # 2. Create an App Store Connect API Key (for notarytool to use):
  # App Store Connect → Users and Access → Integrations/Keys → create
  # a new key. Download the .p8 (it can only be downloaded once), and
  # note the Key ID and Issuer ID. Also base64-encode the .p8.
  #
  # 3. Add the GitHub Secrets: MACOS_DEVELOPER_ID_CERT,
  # MACOS_DEVELOPER_ID_CERT_PWD, AC_API_KEY_ID, AC_API_ISSUER_ID,
  # AC_API_KEY (the base64 of the .p8); reuse your existing
  # MACOS_KEYCHAIN_PWD for the keychain password

  package-macos-dmg-notarized:
    env:
      DEVELOPER_ID_APP_CERT_NAME: "Developer ID Application: Togaware Pty Ltd (G7843T3SD3)"
    needs: gate
    if: needs.gate.outputs.notarized == 'true'
    runs-on: macos-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # Install the Developer ID Application certificate
      - name: Install Developer ID certificate
        env:
          DEVELOPER_ID_CERT: ${{ secrets.MACOS_DEVELOPER_ID_CERT }}
          DEVELOPER_ID_CERT_PWD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PWD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/developer_id.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$DEVELOPER_ID_CERT" | base64 --decode -o $CERT_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$DEVELOPER_ID_CERT_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build Flutter macOS app
        run: flutter build macos --release

      # Sign with Developer ID and enable the hardened runtime (--options runtime).
      # The hardened runtime is a mandatory requirement for notarisation.
      - name: Codesign app with hardened runtime
        run: |
          APP="build/macos/Build/Products/Release/${{ env.APP }}.app"
          # Sign all internal frameworks / dylibs first (inside-out)
          find "$APP/Contents/Frameworks" -type f \( -name "*.dylib" -o -name "*.framework" \) -print0 2>/dev/null | \
            while IFS= read -r -d '' f; do
              codesign --force --timestamp --options runtime \
                --sign "$DEVELOPER_ID_APP_CERT_NAME" "$f"
            done
          # Then sign the whole app (with entitlements)
          codesign --force --timestamp --options runtime \
            --entitlements macos/Runner/Release.entitlements \
            --sign "$DEVELOPER_ID_APP_CERT_NAME" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp -R "build/macos/Build/Products/Release/${{ env.APP }}.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "${{ env.APP }}" \
            -srcfolder dmg_temp -ov -format UDZO "${{ env.APP }}-macos.dmg"

      - name: Sign the DMG
        run: |
          codesign --force --timestamp \
            --sign "$DEVELOPER_ID_APP_CERT_NAME" "${{ env.APP }}-macos.dmg"

      # Notarisation: submit the DMG to Apple; --wait blocks until the result is returned
      - name: Notarize DMG
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: |
          echo -n "$AC_API_KEY" | base64 --decode -o $RUNNER_TEMP/AuthKey.p8
          xcrun notarytool submit "${{ env.APP }}-macos.dmg" \
            --key $RUNNER_TEMP/AuthKey.p8 \
            --key-id "$AC_API_KEY_ID" \
            --issuer "$AC_API_ISSUER_ID" \
            --wait

      # Staple the notarisation ticket onto the DMG so it passes Gatekeeper even offline
      - name: Staple ticket
        run: xcrun stapler staple "${{ env.APP }}-macos.dmg"

      - name: Verify Gatekeeper acceptance
        run: |
          spctl -a -t open --context context:primary-signature -vvv "${{ env.APP }}-macos.dmg" || true
          xcrun stapler validate "${{ env.APP }}-macos.dmg"

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP }}-macos-notarized-dmg
          path: ${{ env.APP }}-macos.dmg
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Published, not a draft, so every build workflow adds to the same
          # release; a second create fails because the first won, hence the
          # final view.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --verify-tag --generate-notes --title "Papertrail ${TAG#v}" \
            || gh release view "$TAG" >/dev/null
          cp "${APP}-macos.dmg" "${APP}-macos-notarized.dmg"
          gh release upload "$TAG" "${APP}-macos-notarized.dmg" --clobber

  ########################################################################
  # MACOS - UNSIGNED

  # This is a build without signing using a certificate, and is meant
  # for testing by developers.
  #
  # This build prevents keychain access capability and so the app
  # fails to use secure local storage and the user needs to press
  # login and the security key submit buttons twice to override the
  # app install warnings
  #
  # Set the unsigned config flavor in macos/project.yml
  #
  # CODE_SIGN_IDENTITY: ""
  # PROVISIONING_PROFILE_SPECIFIER: ""

  package-macos-dmg-zip-unsigned:
    needs: gate
    if: needs.gate.outputs.unsigned == 'true'
    runs-on: macos-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Confirm Flutter Version
        run: flutter --version

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # Configure project build configuration files
      - name: Generate project build configuration files
        run: |
          brew install xcodegen
          cd macos
          xcodegen generate
          cd ..

      - name: Install macOS Pods
        run: |
          cd macos
          pod install --repo-update
          cd ..

      # Build an unsigned app

      - name: Build Flutter macOS app
        run: flutter build macos --release --flavor unsigned

      - name: Note the build location
        run: |
          pwd
          ls -lh ${{env.MACOS_APP_RELEASE_UNSIGNED_PATH}}

      - name: Check macOS app code signature
        run: |
          codesign --display --verbose=2 "${{env.MACOS_APP_RELEASE_UNSIGNED_PATH}}/${{env.APP}}.app"

      # Package as DMG

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp -R "${{ env.MACOS_APP_RELEASE_UNSIGNED_PATH }}/${{ env.APP }}.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "${{env.APP}}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "${{env.APP}}-macos-unsigned.dmg"

      - name: Note the DMG created
        run: |
          ls -lh ${{env.APP}}-macos-unsigned.dmg

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP }}-macos-unsigned-dmg
          path: ${{ env.APP }}-macos-unsigned.dmg

      # Package as ZIP

      - name: Create ZIP
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          directory: ${{env.MACOS_APP_RELEASE_UNSIGNED_PATH}}
          path: ${{env.APP}}.app
          filename: ${{env.APP}}-macos-unsigned.zip

      - name: Review ZIP exists
        run: ls -lh ${{env.MACOS_APP_RELEASE_UNSIGNED_PATH}}/${{env.APP}}-macos-unsigned.zip

      - name: Upload Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP }}-macos-unsigned-zip
          path: ${{ env.MACOS_APP_RELEASE_UNSIGNED_PATH }}/${{env.APP}}-macos-unsigned.zip

  ########################################################################
  # MACOS - DISTRIBUTION CERTIFICATE SIGNED FOR UPLOAD AND ACCESS FROM APP STORE/APP STORE TESTFLIGHT

  # The created notepod.pkg can be uploaded to app store manually with
  # macos Transporter app, or with codemagic-cli-tools app-store-connect with an app store API key.
  # Uses Mac App Distrtibution cert and associated profile
  # for app store distribution to sign the .app,
  # packages as .pkg and signs with Mac App Installer cert as
  # required to upload to App Store. Only installable from App Store
  # or via App Store Testflight.
  # Set staging config flavor in macos/project.yml
  # CODE_SIGN_IDENTITY: "3rd Party Mac Developer Application"
  # PROVISIONING_PROFILE_SPECIFIER: "NotePod_Mac_Distribution_Mac_Appstore_Connect"
  # ie.
  # Build Certificate name: Togaware Pty Ltd
  # Build Certificate type: Mac App Distrtibution
  # Install Certificate name: Togaware Pty Ltd
  # Install Certificate type: 3rd Party Mac Developer Installer
  # Profile name: NotePod_Mac_Distribution_Mac_Appstore_Connect
  # Profile type: Mac Appstore Connect (distribution profile)
  # Profile linked apps: com.togaware.notepod
  # Profile linked certificate: Togaware Pty Ltd
  # Build Certificate creation date: 29/10/2025
  # Install Certificate creation date: 10/12/2025
  # Profile creation date: 29/10/2025

  package-macos-pkg-appstore:
    env:
      MACOS_INSTALL_CERTIFICATE_NAME: "3rd Party Mac Developer Installer: Togaware Pty Ltd (G7843T3SD3)"
    needs: gate
    if: needs.gate.outputs.appstore == 'true'
    runs-on: macos-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Confirm Flutter Version
        run: flutter --version

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # Configure project build configuration files
      - name: Generate project build configuration files
        run: |
          brew install xcodegen
          cd macos
          xcodegen generate

      - name: Install macOS Pods
        run: |
          cd macos
          pod install --repo-update

      # Install certificate and MACOS provisioning profile for app signing

      - name: Install Apple certificate and MACOS provisioning profile
        env:
          # Used to build code signed .app with entitlements
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          # Provisioning profile of app
          MACOS_PROVISION_PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
          # Used to code sign .pkg for upload to App Store Connect
          MACOS_INSTALL_CERTIFICATE: ${{ secrets.MACOS_INSTALL_CERTIFICATE }}
          MACOS_INSTALL_CERTIFICATE_PWD: ${{ secrets.MACOS_INSTALL_CERTIFICATE_PWD}}
          # Used to secure keychain
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |

          echo "Create variables for filepaths for certificate, provisioning profile, and keychain"
          BUILD_CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          INSTALL_CERTIFICATE_PATH=$RUNNER_TEMP/install_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "Import build and install certificates, and provisioning profile from secrets"
          echo -n "$MACOS_CERTIFICATE" | base64 --decode -o $BUILD_CERTIFICATE_PATH
          echo -n "$MACOS_INSTALL_CERTIFICATE" | base64 --decode -o $INSTALL_CERTIFICATE_PATH
          echo -n "$MACOS_PROVISION_PROFILE" | base64 --decode -o $PP_PATH

          echo "Create temporary keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "Import build certificate to keychain"
          security import $BUILD_CERTIFICATE_PATH -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          echo "Import install certificate to keychain"
          security import $INSTALL_CERTIFICATE_PATH -P "$MACOS_INSTALL_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          echo "Add to partition list to allow access to keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo "Apply provisioning profile"
          # Although specifies mobile, this location is meant to be correct for
          # macos and ios provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      # Build and sign the app
      # Uses a scheme 'staging' which build and code signs app
      # with App Store distribution certificate

      - name: Build Flutter macOS app
        run: flutter build macos --release --flavor staging

      - name: Note the build location
        run: |
          pwd
          ls -lh ${{ env.MACOS_APP_RELEASE_STAGING_PATH }}

      - name: Check macOS app code signature
        run: |
          codesign --display --verbose=2 "${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}.app"

      # # Package as DMG

      # - name: Create DMG
      #   run: |
      #     mkdir -p dmg_temp
      #     cp -R "${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}.app" dmg_temp/
      #     ln -s /Applications dmg_temp/Applications
      #     hdiutil create -volname "${{ env.APP }}" \
      #       -srcfolder dmg_temp \
      #       -ov -format UDZO \
      #       "${{ env.APP }}-macos-staging.dmg"

      # - name: Note the DMG created
      #   run: |
      #     ls -lh ${{ env.APP }}-macos-staging.dmg

      # - name: Upload Artefact
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: ${{ env.APP }}-macos-staging-dmg
      #     path: ${{ env.APP }}-macos-staging.dmg

      # # Package as ZIP

      # - name: Create ZIP
      #   uses: thedoctor0/zip-release@master
      #   with:
      #     type: "zip"
      #     directory: ${{ env.MACOS_APP_RELEASE_STAGING_PATH }}
      #     path: ${{ env.APP }}.app
      #     filename: ${{ env.APP }}-macos-staging.zip

      # - name: Review ZIP exists
      #   run: ls -lh ${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}-macos-staging.zip

      # - name: Upload Artefact
      #   uses: actions/upload-artifact@v6
      #   with:
      #     name: ${{ env.APP }}-macos-staging-zip
      #     path: ${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}-macos-staging.zip

      # Create PKG for App Store
      - name: Create PKG for App Store upload
        run: |
          xcrun productbuild --component "${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}.app" /Applications/ "${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}-unsigned.pkg"

      - name: Note the not installer-signed PKG created
        run: |
          ls -lh ${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}-unsigned.pkg

      # Sign PKG with Mac Distribution Installer Certificate
      - name: Sign PKG with Installer Certificate
        run: |
          xcrun productsign --sign "${{ env.MACOS_INSTALL_CERTIFICATE_NAME }}" "${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}-unsigned.pkg" "${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}.pkg"

      - name: Note the installed signed PKG ready for upload
        run: |
          ls -lh ${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}.pkg

      - name: Upload pkg artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP }}-macos-pkg
          path: ${{ env.MACOS_APP_RELEASE_STAGING_PATH }}/${{ env.APP }}.pkg

      # 20251211 jesscmoore TODO: add upload to app store step. Reqs
      # Appstore Connect API key

      # Ref: https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications

  ########################################################################
  # MACOS - DEVELOPMENT CERTIFICATE SIGNED FOR DEV TESTING

  # Uses Development cert and associated profile
  # for testing by developers using devices registered on Apple Developer account
  # Certificate name: Jessica Moore
  # Certificate type: Development
  # Profile name: Wildcard_Development_Mac_App_Development
  # Profile type: macOS App Development (development profile)
  # Profile linked apps: * (wildcard allowed for development profiles)
  # Profile linked certificate: Jessica Moore
  # Profile linked devices: c71, boofy
  # Certificate creation date: 23/10/2025
  # Profile creation date: 29/10/2025

  package-macos-dmg-zip-dev:
    needs: gate
    if: needs.gate.outputs.dev == 'true'
    runs-on: macos-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{env.FLUTTER_VERSION}}

      - name: Confirm Flutter Version
        run: flutter --version

      - name: Install Flutter Project Dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      # Configure project build configuration files
      - name: Generate project build configuration files
        run: |
          brew install xcodegen
          cd macos
          xcodegen generate

      - name: Install macOS Pods
        run: |
          cd macos
          pod install --repo-update

      # Install certificate and provisioning profile for app signing.

      - name: Install Apple certificate and provisioning profile
        env:
          MACOS_CERTIFICATE_DEV: ${{ secrets.MACOS_CERTIFICATE_DEV }}
          MACOS_CERTIFICATE_DEV_PWD: ${{ secrets.MACOS_CERTIFICATE_DEV_PWD }}
          MACOS_PROVISION_PROFILE_DEV: ${{ secrets.MACOS_PROVISION_PROFILE_DEV }}
          KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PWD }}
        run: |

          echo "Create variables for filepaths for certificate, provisioning profile, and keychain"
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo "Import certificate and provisioning profile from secrets"
          echo -n "$MACOS_CERTIFICATE_DEV" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$MACOS_PROVISION_PROFILE_DEV" | base64 --decode -o $PP_PATH

          echo "Create temporary keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          echo "Import certificate to keychain"
          security import $CERTIFICATE_PATH -P "$MACOS_CERTIFICATE_DEV_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          echo "Add to partition list to allow access to keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          echo "Apply provisioning profile"
          # Although specifies mobile, this location is meant to be correct for
          # macos and ios provisioning profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      # Build and sign the app
      # Uses a scheme 'dev' created in Xcode to have a separate
      # build configuration to specify the cert and profile used for
      # dev build. Then specify scheme name as flavour in flutter CLI.
      # Certificate type (xcode var CODE_SIGN_IDENTITY)
      # Provisioning profile name (xcode var PROVISIONING_PROFILE_SPECIFIER)

      - name: Build Flutter macOS app
        # By default, app is codesigned, unless --no-codesign is used.
        run: flutter build macos --release --flavor dev

      - name: Note the build location
        run: |
          pwd
          ls -lh ${{ env.MACOS_APP_RELEASE_DEV_PATH }}

      - name: Check macOS app code signature
        run: |
          codesign --display --verbose=2 "${{ env.MACOS_APP_RELEASE_DEV_PATH }}/${{ env.APP }}.app"

      # Package as DMG

      - name: Create DMG
        run: |
          mkdir -p dmg_temp
          cp -R "${{ env.MACOS_APP_RELEASE_DEV_PATH }}/${{ env.APP }}.app" dmg_temp/
          ln -s /Applications dmg_temp/Applications
          hdiutil create -volname "${{ env.APP }}" \
            -srcfolder dmg_temp \
            -ov -format UDZO \
            "${{ env.APP }}-macos-dev.dmg"

      - name: Note the DMG created
        run: |
          ls -lh ${{ env.APP }}-macos-dev.dmg

      - name: Upload DMG Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP }}-macos-dev-dmg
          path: ${{ env.APP }}-macos-dev.dmg

      # Package as ZIP

      - name: Create ZIP
        uses: thedoctor0/zip-release@master
        with:
          type: "zip"
          directory: ${{ env.MACOS_APP_RELEASE_DEV_PATH }}
          path: ${{ env.APP }}.app
          filename: ${{ env.APP }}-macos-dev.zip

      - name: Review ZIP exists
        run: ls -lh ${{ env.MACOS_APP_RELEASE_DEV_PATH }}/${{ env.APP }}-macos-dev.zip

      - name: Upload ZIP Artefact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.APP }}-macos-dev-zip
          path: ${{ env.MACOS_APP_RELEASE_DEV_PATH }}/${{ env.APP }}-macos-dev.zip

      # Ref: https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications

  ########################################################################
